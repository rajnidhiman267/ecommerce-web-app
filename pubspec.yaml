name: ecommerce_admin_panel
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4
 
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3

  #utility package
  intl: ^0.20.3
  lottie: ^3.3.3
  shimmer: ^3.0.0
  clipboard: ^3.0.14
  image_picker: ^1.2.2
  url_launcher: ^6.3.2
  flutter_dropzone: ^4.2.1
  flutter_typeahead: ^6.0.0
  connectivity_plus: ^7.1.1
  multi_select_flutter: ^4.1.3
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.8
  smooth_page_indicator: ^2.0.1

  #web specific
  web: ^1.1.1
  http: ^1.6.0
  html: ^0.15.6
  fl_chart: ^1.2.0
  data_table_2: ^2.7.2
  url_strategy: ^0.3.0

  iconsax: ^0.0.8

  get: ^4.7.3
  get_storage: ^2.1.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^6.0.0

 

 
flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/content/
    - assets/images/animations/
    - assets/icons/payment_methods/
  fonts:
    - family: Urbanist
    - fonts:
        - asset: assets/fonts/urbanist/Urbanist-Light.ttf
          weight: 300
        - asset: assets\fonts\urbanist\Urbanist-Regular.ttf
          weight: 400
        - asset: assets\fonts\urbanist\Urbanist-Italic.ttf
          style: italic
        - asset: assets\fonts\urbanist\Urbanist-Medium.ttf
          weight: 500
        - asset: assets\fonts\urbanist\Urbanist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets\fonts\urbanist\Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets\fonts\urbanist\Urbanist-Bold.ttf
          weight: 800



  
 
